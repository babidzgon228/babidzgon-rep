# Профиль и учебное расписание. Загружается в бота при первом /start.
# Потом всё редактируется прямо в боте: 🎓 Расписание и ⚙️ Настройки
# (или поправь этот файл, удали data/bot.db и перезапусти бота).

# Осенний семестр в Шэньчжэне. Вне этих дат пары не показываются (каникулы).
semester_start: 2026-09-01
semester_end: 2027-01-31

settings:
  # Часовой пояс меняется автоматически по датам:
  # сентябрь–январь и март–15 июля — Шэньчжэнь, остальное время — Москва.
  tz_auto: true
  home_tz: Europe/Moscow
  tz_rules:
    - {from: "09-01", to: "01-31", tz: Asia/Shanghai, label: Шэньчжэнь}
    - {from: "03-01", to: "07-15", tz: Asia/Shanghai, label: Шэньчжэнь}
  tz: Asia/Shanghai
  # Режим дня
  wake_time: "08:30"
  sleep_time: "00:30"
  morning_brief_time: "08:45"
  evening_plan_time: "22:30"
  focus_peak: morning

# Формат пары:
#   day: пн|вт|ср|чт|пт|сб|вс
#   time: "ЧЧ:ММ-ЧЧ:ММ"
#   subject: название;  kind: лекция/практика/семинар (необязательно)
#   room: аудитория;  teacher: преподаватель (необязательно)
#   weeks: all (каждую неделю) | odd (нечётные) | even (чётные)
lessons:
  # ── Понедельник
  - {day: пн, time: "09:00-10:30", subject: Английский язык, room: "1-301"}
  - {day: пн, time: "10:45-12:15", subject: Деловой китайский, room: "3-313"}
  - {day: пн, time: "15:45-17:15", subject: Устный китайский, room: "3-313"}

  # ── Вторник
  - {day: вт, time: "09:00-10:30", subject: Английский язык, room: "1-206"}
  - {day: вт, time: "14:00-15:30", subject: Курс письма, teacher: Ли}
  - {day: вт, time: "15:45-17:15", subject: Деловой китайский}

  # ── Среда
  - {day: ср, time: "09:00-10:30", subject: Фэн Ли, room: "3-216"}
  - {day: ср, time: "10:45-12:15", subject: Чтение, teacher: Ли, room: "3-313"}
  - {day: ср, time: "14:00-15:30", subject: Экономика Китая, teacher: Карпов, room: "1-301"}
  - {day: ср, time: "15:45-17:15", subject: Аудирование, teacher: Гао, room: "1-207"}
  - {day: ср, time: "18:00-20:30", subject: Обзор Китая, teacher: Ли, room: "3-313"}

  # ── Четверг
  - {day: чт, time: "09:00-10:30", subject: Комплексный китайский, room: "3-313"}
  - {day: чт, time: "14:00-17:15", subject: Современная экономика, teacher: Карпов, room: "1-420"}
  - {day: чт, time: "18:00-19:30", subject: Каменских, room: "1-301"}

  # ── Пятница
  - {day: пт, time: "09:00-15:30", subject: Иванченко, room: "1-301"}
  - {day: пт, time: "15:45-17:15", subject: Чтение, teacher: Ли}
